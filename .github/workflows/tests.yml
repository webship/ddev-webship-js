name: tests
on:
  pull_request:
    branches: [ 2.0.x ]
    paths-ignore:
      - "**.md"
  push:
    branches: [ 2.0.x ]
    paths-ignore:
      - "**.md"

  schedule:
    - cron: '25 08 * * *'

  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: Debug with tmate
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    strategy:
      matrix:
        # Pinned to the lowest DDEV version install.yaml allows: stable and HEAD move under the tests.
        ddev_version: ['tag:v1.24.7']
      fail-fast: false

    runs-on: ubuntu-latest

    steps:
      - uses: ddev/github-action-add-on-test@v2
        with:
          ddev_version: ${{ matrix.ddev_version }}
          token: ${{ secrets.GITHUB_TOKEN }}
          debug_enabled: ${{ github.event.inputs.debug_enabled }}
          addon_repository: ${{ env.GITHUB_REPOSITORY }}
          addon_ref: ${{ env.GITHUB_REF }}
