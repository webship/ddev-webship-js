<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Webship-JS Example</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 60px auto;
      padding: 0 20px;
      color: #333;
    }
    h1 { color: #2c5282; }
    p { line-height: 1.6; }
    .badge {
      display: inline-block;
      background: #2c5282;
      color: #fff;
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 0.85em;
    }
  </style>
</head>
<body>
  <h1>Welcome to Webship-JS</h1>
  <p>This is an example page used to verify that the DDEV web environment is running correctly.</p>
  <p><span class="badge">DDEV</span> &nbsp; <span class="badge">Playwright</span> &nbsp; <span class="badge">Cucumber</span></p>
  <p>Environment: <strong id="env">development</strong></p>
</body>
</html>
